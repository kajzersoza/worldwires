<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background transparent -->
  <g id="ww-emblem" transform="translate(0, -10)">
    <!-- Left Circle: White with dark slate border -->
    <circle cx="178" cy="205" r="76" fill="#FFFFFF" stroke="#2D3748" stroke-width="8" />

    <!-- Right Circle: Solid Teal -->
    <circle cx="318" cy="205" r="80" fill="#008E9B" />

    <!-- Left "W" (Dark Charcoal) -->
    <path 
      d="M 132 172 L 158 244 L 182 178 L 206 244 L 228 172" 
      fill="none" 
      stroke="#2D3748" 
      stroke-width="15" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Horizontal Interconnecting Bridge -->
    <line 
      x1="228" y1="172" 
      x2="268" y2="172" 
      stroke="#2D3748" 
      stroke-width="14" 
      stroke-linecap="round"
    />

    <!-- Right "W" (Pure White) -->
    <path 
      d="M 268 172 L 294 244 L 318 178 L 342 244 L 368 172" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="15" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
  </g>

  <!-- Typography: WORLD WIRES -->
  <g id="ww-text" transform="translate(256, 365)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="2">
      <tspan fill="#2D3748">WORLD </tspan>
      <tspan fill="#008E9B">WIRES</tspan>
    </text>
    <!-- KFT. Badge / Subtitle -->
    <text y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#008E9B" letter-spacing="5">
      KFT.
    </text>
  </g>
</svg>
